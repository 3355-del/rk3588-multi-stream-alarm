<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">告警如何投递、确认与重试</title><desc id="desc">reliable=true 时：先持久化待发事件，收到匹配 ACK 后移除待发记录</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#b65b21"/></marker></defs><rect width="1200" height="760" rx="20" fill="#f5f7fa"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" fill="#172c43"><rect x="44" y="40" width="7" height="56" rx="3" fill="#b65b21"/><text x="70" y="66" font-size="30" font-weight="700">告警如何投递、确认与重试</text><text x="70" y="99" font-size="18" fill="#52657a">reliable=true 时：先持久化待发事件，收到匹配 ACK 后移除待发记录</text><rect x="44" y="145" width="335" height="150" rx="12" fill="#fff" stroke="#cbd6e0"/><rect x="44" y="145" width="5" height="150" rx="2" fill="#b65b21"/><text x="66" y="183" font-size="24" font-weight="700">生成告警事件</text><text x="66" y="218" font-size="19" fill="#52657a">event_id 标识事件</text><text x="66" y="247" font-size="19" fill="#52657a">PNG 截图保存在本地</text><rect x="433" y="145" width="335" height="150" rx="12" fill="#fff" stroke="#cbd6e0"/><rect x="433" y="145" width="5" height="150" rx="2" fill="#b65b21"/><text x="455" y="183" font-size="24" font-weight="700">写入本地 outbox</text><text x="455" y="218" font-size="19" fill="#52657a">临时文件 → 同步 → 重命名</text><text x="455" y="247" font-size="19" fill="#52657a">最多 10000 条待发事件</text><rect x="821" y="145" width="335" height="150" rx="12" fill="#fff" stroke="#cbd6e0"/><rect x="821" y="145" width="5" height="150" rx="2" fill="#b65b21"/><text x="843" y="183" font-size="24" font-weight="700">TCP JSON 发送</text><text x="843" y="218" font-size="19" fill="#52657a">独立发送线程</text><text x="843" y="247" font-size="19" fill="#52657a">失败时保留并重试</text><path d="M379 220H433" fill="none" stroke="#b65b21" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M768 220H821" fill="none" stroke="#b65b21" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M988 295V365" fill="none" stroke="#b65b21" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="821" y="365" width="335" height="150" rx="12" fill="#fff" stroke="#cbd6e0"/><rect x="821" y="365" width="5" height="150" rx="2" fill="#b65b21"/><text x="843" y="403" font-size="24" font-weight="700">Python 接收端</text><text x="843" y="438" font-size="19" fill="#52657a">按 event_id 去重</text><text x="843" y="467" font-size="19" fill="#52657a">SQLite 提交成功后 ACK</text><rect x="433" y="365" width="335" height="150" rx="12" fill="#fff" stroke="#cbd6e0"/><rect x="433" y="365" width="5" height="150" rx="2" fill="#b65b21"/><text x="455" y="403" font-size="24" font-weight="700">校验 ACK</text><text x="455" y="438" font-size="19" fill="#52657a">匹配当前事件 event_id</text><text x="455" y="467" font-size="19" fill="#52657a">确认后删除对应待发文件</text><path d="M821 440H768" fill="none" stroke="#b65b21" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M600 365V330H988V295" fill="none" stroke="#b65b21" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="616" y="321" font-size="18" fill="#52657a">未确认：待发事件留存并重试</text><rect x="44" y="555" width="1112" height="98" rx="12" fill="#fff0df"/><text x="68" y="591" font-size="23" font-weight="700">可靠性有边界</text><text x="68" y="625" font-size="20">依赖磁盘、文件系统与网络状态；不承诺无限缓存或绝对不丢失。截图不随此协议传输。</text><path d="M44 697H1156" stroke="#d3dce5"/><text x="44" y="729" font-size="17" fill="#52657a">基于仓库代码的流程示意 · 非真机截图 · 不表示新增硬件验证或性能承诺</text></g></svg>
