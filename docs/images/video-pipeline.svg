<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">多路视频，从帧输入到告警事件</title><desc id="desc">每路四阶段流水线；有界队列控制积压，满时丢弃最旧帧</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#b65b21"/></marker></defs><rect width="1200" height="760" rx="20" fill="#f5f7fa"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" fill="#172c43"><rect x="44" y="40" width="7" height="56" rx="3" fill="#b65b21"/><text x="70" y="66" font-size="30" font-weight="700">多路视频，从帧输入到告警事件</text><text x="70" y="99" font-size="18" fill="#52657a">每路四阶段流水线；有界队列控制积压，满时丢弃最旧帧</text><rect x="44" y="145" width="1112" height="103" rx="12" fill="#fff" stroke="#cbd6e0"/><rect x="44" y="145" width="5" height="103" rx="2" fill="#b65b21"/><text x="66" y="183" font-size="24" font-weight="700">输入源</text><text x="66" y="218" font-size="19" fill="#52657a">USB / V4L2 · 本地视频 · RTSP（FFmpeg 解复用 + MPP 硬解）</text><path d="M170 248V305" fill="none" stroke="#b65b21" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="44" y="305" width="248" height="150" rx="12" fill="#fff" stroke="#cbd6e0"/><rect x="44" y="305" width="5" height="150" rx="2" fill="#b65b21"/><text x="66" y="343" font-size="24" font-weight="700">01 采集</text><text x="66" y="378" font-size="19" fill="#52657a">硬件 HAL / mock</text><text x="66" y="407" font-size="19" fill="#52657a">RTSP 断线重连</text><rect x="332" y="305" width="248" height="150" rx="12" fill="#fff" stroke="#cbd6e0"/><rect x="332" y="305" width="5" height="150" rx="2" fill="#b65b21"/><text x="354" y="343" font-size="24" font-weight="700">02 预处理</text><text x="354" y="378" font-size="19" fill="#52657a">RGA letterbox</text><text x="354" y="407" font-size="19" fill="#52657a">尺寸与格式转换</text><rect x="620" y="305" width="248" height="150" rx="12" fill="#fff" stroke="#cbd6e0"/><rect x="620" y="305" width="5" height="150" rx="2" fill="#b65b21"/><text x="642" y="343" font-size="24" font-weight="700">03 推理</text><text x="642" y="378" font-size="19" fill="#52657a">RKNN INT8</text><text x="642" y="407" font-size="19" fill="#52657a">DFL + NMS</text><rect x="908" y="305" width="248" height="150" rx="12" fill="#fff" stroke="#cbd6e0"/><rect x="908" y="305" width="5" height="150" rx="2" fill="#b65b21"/><text x="930" y="343" font-size="24" font-weight="700">04 告警</text><text x="930" y="378" font-size="19" fill="#52657a">多边形区域</text><text x="930" y="407" font-size="19" fill="#52657a">类别 + 冷却时间</text><path d="M292 380H332" fill="none" stroke="#b65b21" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M580 380H620" fill="none" stroke="#b65b21" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M868 380H908" fill="none" stroke="#b65b21" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="297" y="294" font-size="18" fill="#52657a">队列</text><text x="585" y="294" font-size="18" fill="#52657a">队列</text><text x="873" y="294" font-size="18" fill="#52657a">队列</text><path d="M1032 455V515" fill="none" stroke="#b65b21" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="44" y="515" width="1112" height="125" rx="12" fill="#fff" stroke="#cbd6e0"/><rect x="44" y="515" width="5" height="125" rx="2" fill="#b65b21"/><text x="66" y="553" font-size="24" font-weight="700">独立 I/O 线程</text><text x="66" y="588" font-size="19" fill="#52657a">PNG 截图落盘 → 本地待发队列 → TCP JSON → 接收端 SQLite → ACK</text><text x="44" y="680" font-size="18" fill="#52657a">DMA-BUF 用于部分 MPP → RGA → RKNN 路径；USB 采集和截图仍有拷贝。</text><path d="M44 697H1156" stroke="#d3dce5"/><text x="44" y="729" font-size="17" fill="#52657a">基于仓库代码的流程示意 · 非真机截图 · 不表示新增硬件验证或性能承诺</text></g></svg>
